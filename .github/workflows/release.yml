name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: corepack pnpm verify:release-candidate

      - name: Run release gates
        run: corepack pnpm verify

      - name: Audit production dependencies
        run: corepack pnpm audit:prod

  publish:
    name: Publish npm packages
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build publish artifacts
        run: corepack pnpm build

      - name: Pack and verify publish artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zaowu-npm"
          corepack pnpm --filter './packages/*' pack --pack-destination "$RUNNER_TEMP/zaowu-npm"
          node scripts/verify-publish-artifacts.mjs "$RUNNER_TEMP/zaowu-npm"

      - name: Publish verified tarballs in dependency order with provenance
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          for package in core ai auto config data dev doc plugin teach web cli; do
            npm publish "$RUNNER_TEMP/zaowu-npm/zaowu-labs-${package}-${version}.tgz" --access public --provenance
          done

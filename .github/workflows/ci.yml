name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
        node-version:
          - 20.19.0
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check native Node architecture on macOS
        if: runner.os == 'macOS'
        env:
          EXPECTED_NODE_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        run: node -e 'if (process.arch !== process.env.EXPECTED_NODE_ARCH) throw new Error(`Expected ${process.env.EXPECTED_NODE_ARCH}, got ${process.arch}`)'

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build
        run: corepack pnpm build

      - name: Typecheck tests
        run: corepack pnpm typecheck:test

      - name: Check source structure
        run: corepack pnpm verify:structure

      - name: Audit production dependencies
        run: corepack pnpm audit:prod

      - name: Check schemas and examples
        run: corepack pnpm verify:schemas

      - name: Check rich fixtures
        run: corepack pnpm verify:fixtures

      - name: Check JSON contracts
        run: corepack pnpm verify:json-contracts

      - name: Check release readiness
        run: corepack pnpm verify:release

      - name: Check package contents
        run: corepack pnpm pack:check

      - name: Verify publish artifacts
        run: corepack pnpm verify:publish-artifacts

      - name: Smoke test packed CLI install
        run: corepack pnpm verify:pack-install

      - name: Smoke test npm installation on macOS
        if: runner.os == 'macOS'
        run: corepack pnpm verify:pack-install:npm

      - name: Check command capability matrix
        run: corepack pnpm verify:capabilities

      - name: Smoke test CLI
        run: corepack pnpm verify:smoke

      - name: Test
        run: corepack pnpm test

      - name: Lint
        run: corepack pnpm lint

      - name: Check formatting
        run: corepack pnpm format:check

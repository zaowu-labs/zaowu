name: Feature request
description: Propose an outcome-oriented improvement
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become easier, safer, or more reliable?
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Individual developer or creator
        - Small team
        - Platform or security team
        - Educator or data/document user
    validations:
      required: true
  - type: checkboxes
    id: capabilities
    attributes:
      label: Potential capabilities
      options:
        - label: Reads files
        - label: Writes or deletes files
        - label: Uses network or AI providers
        - label: Accesses secrets
        - label: Runs shell or modifies Git
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing ZaoWu commands or other tools you tried.
